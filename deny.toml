[advisories]
version = 2
yanked = "deny"
ignore = ["RUSTSEC-2025-0141"] # Unavoidable transitive of pinned Solana 4.0 SDK; unmaintained, not a vulnerability.

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
